# ===========================================
# StartSmart AI - Production Configuration
# For deployment on Render.com
# All values are read from environment variables
# set in the Render dashboard (no hardcoded secrets).
# ===========================================

# Server Configuration
# Render provides a PORT env var; Spring Boot reads it here.
# Falls back to 8080 for local Docker testing.
server.port=${PORT:8080}

# -----------------------------------------------------------
# Database Configuration (Neon PostgreSQL)
# Set these in Render dashboard -> Environment Variables:
#   DB_URL      -> jdbc:postgresql://... (Neon connection string)
#   DB_USERNAME -> database user
#   DB_PASSWORD -> database password
# -----------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -----------------------------------------------------------
# Gemini AI API Configuration
# Set these in Render dashboard -> Environment Variables:
#   GEMINI_API_URL -> Google Gemini API endpoint
#   GEMINI_API_KEY -> Google Gemini API key
# -----------------------------------------------------------
gemini.api.url=${GEMINI_API_URL}
gemini.api.key=${GEMINI_API_KEY}